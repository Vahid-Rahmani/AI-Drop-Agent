services:
  api:
    build: .
    environment:
      APP_MODE: simulation
      KILL_SWITCH: "false"
      DATABASE_URL: sqlite:///data/ai_drop_agent.db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
