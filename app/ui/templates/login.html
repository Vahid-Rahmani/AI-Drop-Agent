<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Drop Agent · Admin Login</title>
  <link rel="stylesheet" href="/admin/static/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="login-title">
    <div class="eyebrow">AI DROP AGENT</div>
    <h1 id="login-title">Operator control panel</h1>
    <p class="muted">Sign in with the configured bootstrap admin key. It is used only for this request and is never stored in the browser.</p>
    <form id="login-form">
      <label for="admin-key">Admin API key</label>
      <input id="admin-key" name="admin_api_key" type="password" autocomplete="current-password" required>
      <button class="primary wide" type="submit">Sign in securely</button>
      <p id="login-error" class="form-error" role="alert"></p>
    </form>
    <p class="footnote">Live mode requires AUTH_SECRET and ADMIN_API_KEY. Use HTTPS in production.</p>
  </main>
  <script src="/admin/static/login.js" defer></script>
</body>
</html>
